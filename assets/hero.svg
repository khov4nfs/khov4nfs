<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#30363d" stroke-width="0.7" opacity=".5"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1000" height="320" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)" opacity=".34"/>
    <rect x="-240" y="0" width="180" height="320" fill="url(#accent)" opacity=".08" transform="skewX(-16)">
      <animate attributeName="x" from="-240" to="1180" dur="7s" repeatCount="indefinite"/>
    </rect>
    <circle cx="830" cy="145" r="94" fill="none" stroke="#a78bfa" stroke-width="1.4" opacity=".52">
      <animate attributeName="r" values="88;103;88" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".26;.64;.26" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="145" r="61" fill="none" stroke="#7dd3fc" stroke-width="1.1" opacity=".55" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="0 830 145" to="360 830 145" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="145" r="5" fill="#e9d5ff" filter="url(#glow)"/>
    <circle cx="891" cy="145" r="4" fill="#7dd3fc" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 830 145" to="-360 830 145" dur="7s" repeatCount="indefinite"/>
    </circle>

    <text x="66" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#8b949e" letter-spacing="2">PROFILE / SYSTEM ONLINE</text>
    <text x="64" y="147" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="800" fill="#f0f6fc" letter-spacing="-3">kho.v4nfs</text>
    <rect x="66" y="170" width="510" height="3" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="120;510;310;510" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="66" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#c9d1d9">full-stack engineer · systems · product · ai tooling</text>
    <text x="66" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#8b949e">$ build things that feel simple on the surface</text>
    <rect x="512" y="239" width="10" height="18" rx="2" fill="#a78bfa">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8b949e">
      <text x="777" y="277">minh / vn / utc+7</text>
      <text x="786" y="295">build • ship • learn</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="998.5" height="318.5" rx="25.25" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>