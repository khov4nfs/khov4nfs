<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" fill="none">
  <defs>
    <linearGradient id="signal" x1="36" y1="0" x2="1164" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".52" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="90" rx="18" fill="#0D1117" stroke="#1F2937"/>
  <rect x="28" y="22" width="48" height="48" rx="12" fill="#09111B" stroke="#243244"/>
  <text x="52" y="53" text-anchor="middle" fill="#22D3EE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">LIVE</text>

  <text x="98" y="39" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">PUBLIC SIGNAL</text>
  <text x="98" y="60" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">followers / profile views / contribution signal / top languages</text>

  <circle cx="1000" cy="46" r="5" fill="#34D399" filter="url(#glow)">
    <animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="1015" y="50" fill="#86EFAC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">metrics.live</text>

  <rect x="1092" y="43" width="58" height="6" rx="3" fill="#16202E"/>
  <rect x="1092" y="43" width="18" height="6" rx="3" fill="url(#signal)">
    <animate attributeName="width" values="16;58;26;50;16" dur="3.6s" repeatCount="indefinite"/>
  </rect>

  <rect x="28" y="84" width="1144" height="2" rx="1" fill="#16202E"/>
  <rect x="28" y="84" width="180" height="2" rx="1" fill="url(#signal)">
    <animate attributeName="x" values="28;964;28" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="width" values="180;208;180" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>