<circle cx="832" cy="330" r="4" fill="#34D399" opacity=".6"/><text x="848" y="335" fill="#C9D1D9" font-size="14" font-family="monospace">shorter path to reliable result</text>
<text x="824" y="360" fill="#34D399" font-size="11" font-family="monospace">signal: faster / sharper / lower friction</text>

