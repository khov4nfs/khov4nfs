<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#0A1017"/></linearGradient>
  <linearGradient id="pulse" x1="90" y1="0" x2="1110" y2="0"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#34D399"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#bg)" stroke="#263241"/>
<text x="54" y="53" fill="#E6EDF3" font-size="24" font-family="monospace" font-weight="700">OPERATING PRINCIPLES</text>
<text x="54" y="80" fill="#6E7F91" font-size="13" font-family="monospace">the checks I want a system to keep passing after it ships</text>
<rect x="965" y="35" width="180" height="34" rx="17" fill="#0D211B" stroke="#1D6A53"/>
<circle cx="989" cy="52" r="6" fill="#34D399"><animate attributeName="opacity" values=".35;1;.35" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="1006" y="57" fill="#7CE8BC" font-size="12" font-family="monospace">system nominal</text>

<!-- matrix -->
<rect x="54" y="116" width="1092" height="168" rx="18" fill="#0E151E" stroke="#202C39"/>
<line x1="272" y1="116" x2="272" y2="284" stroke="#202C39"/><line x1="490" y1="116" x2="490" y2="284" stroke="#202C39"/><line x1="708" y1="116" x2="708" y2="284" stroke="#202C39"/><line x1="926" y1="116" x2="926" y2="284" stroke="#202C39"/>

<g font-family="monospace">
  <text x="82" y="151" fill="#22D3EE" font-size="12">01 / interface</text>
  <text x="82" y="183" fill="#E6EDF3" font-size="17" font-weight="700">CLEAR</text>
  <text x="82" y="210" fill="#8FA3B8" font-size="12">intent is visible</text>
  <text x="82" y="232" fill="#8FA3B8" font-size="12">feedback is useful</text>
  <circle cx="82" cy="258" r="5" fill="#22D3EE"/><text x="98" y="263" fill="#6FE6F7" font-size="11">PASS</text>

  <text x="300" y="151" fill="#A78BFA" font-size="12">02 / contracts</text>
  <text x="300" y="183" fill="#E6EDF3" font-size="17" font-weight="700">EXPLICIT</text>
  <text x="300" y="210" fill="#8FA3B8" font-size="12">boundaries are named</text>
  <text x="300" y="232" fill="#8FA3B8" font-size="12">behavior is predictable</text>
  <circle cx="300" cy="258" r="5" fill="#A78BFA"/><text x="316" y="263" fill="#C4B5FD" font-size="11">PASS</text>

  <text x="518" y="151" fill="#F59E0B" font-size="12">03 / failure</text>
  <text x="518" y="183" fill="#E6EDF3" font-size="17" font-weight="700">VISIBLE</text>
  <text x="518" y="210" fill="#8FA3B8" font-size="12">errors have signals</text>
  <text x="518" y="232" fill="#8FA3B8" font-size="12">recovery is bounded</text>
  <circle cx="518" cy="258" r="5" fill="#F59E0B"/><text x="534" y="263" fill="#FBBF24" font-size="11">PASS</text>

  <text x="736" y="151" fill="#34D399" font-size="12">04 / delivery</text>
  <text x="736" y="183" fill="#E6EDF3" font-size="17" font-weight="700">REPEATABLE</text>
  <text x="736" y="210" fill="#8FA3B8" font-size="12">builds are reproducible</text>
  <text x="736" y="232" fill="#8FA3B8" font-size="12">deploys give feedback</text>
  <circle cx="736" cy="258" r="5" fill="#34D399"/><text x="752" y="263" fill="#7CE8BC" font-size="11">PASS</text>

  <text x="954" y="151" fill="#60A5FA" font-size="12">05 / complexity</text>
  <text x="954" y="183" fill="#E6EDF3" font-size="17" font-weight="700">UNDERSTANDABLE</text>
  <text x="954" y="210" fill="#8FA3B8" font-size="12">structure stays legible</text>
  <text x="954" y="232" fill="#8FA3B8" font-size="12">change cost stays sane</text>
  <circle cx="954" cy="258" r="5" fill="#60A5FA"/><text x="970" y="263" fill="#93C5FD" font-size="11">PASS</text>
</g>

<rect x="54" y="311" width="1092" height="3" rx="1.5" fill="#17202B"/>
<rect x="54" y="311" width="220" height="3" rx="1.5" fill="url(#pulse)" filter="url(#glow)"><animate attributeName="x" values="54;926;54" dur="6s" repeatCount="indefinite"/></rect>
<text x="54" y="338" fill="#75879A" font-size="12" font-family="monospace">goal: make the system easier to reason about after shipping, not harder</text>
</svg>