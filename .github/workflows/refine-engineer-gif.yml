name: Refine engineer GIF (one-shot)

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/refine-engineer-gif.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Render crisp dark pixel-art engineering scene
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import math

          OUT = Path('assets/dev-coding.gif')
          SCALE = 2
          W, H = 450, 207
          COLORS = {
              'bg': '#07101c', 'panel': '#0b1423', 'panel2': '#0e192b',
              'border': '#27364b', 'text': '#dbeafe', 'muted': '#71829a',
              'cyan': '#22d3ee', 'green': '#34d399', 'violet': '#8b5cf6',
              'pink': '#f472b6', 'amber': '#fbbf24', 'dim': '#334155'
          }

          def font(size, bold=False):
              path = '/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf'
              return ImageFont.truetype(path, size)

          f8, f9, f10, f11, f12 = font(8), font(9), font(10), font(11), font(12, True)

          def rr(d, box, radius=5, fill=None, outline=None, width=1):
              d.rounded_rectangle(box, radius=radius, fill=fill, outline=outline, width=width)

          frames = []
          durations = []
          N = 12

          for i in range(N):
              t = i / N
              im = Image.new('RGB', (W, H), COLORS['bg'])
              d = ImageDraw.Draw(im)

              # Subtle engineering grid
              for x in range(0, W, 30):
                  d.line((x, 0, x, H), fill='#0d1a2a')
              for y in range(0, H, 24):
                  d.line((0, y, W, y), fill='#0d1a2a')

              # Header
              rr(d, (10, 9, 440, 26), 6, '#091423', COLORS['border'])
              d.ellipse((18, 15, 22, 19), fill=COLORS['cyan'])
              d.text((27, 13), 'kho.v4nfs / engineering session', font=f8, fill=COLORS['text'])
              d.text((331, 13), 'branch: main', font=f8, fill=COLORS['muted'])
              live = COLORS['green'] if i % 4 < 3 else '#14532d'
              d.text((400, 13), 'LIVE', font=f8, fill=live)
              d.ellipse((430, 15, 434, 19), fill=COLORS['cyan'])

              # Main workstation shell
              rr(d, (10, 34, 440, 188), 8, '#08111e', COLORS['border'])

              # IDE monitor
              rr(d, (23, 45, 195, 137), 6, COLORS['panel'], COLORS['border'])
              d.line((23, 63, 195, 63), fill=COLORS['border'])
              d.text((31, 51), 'src/features/profile.tsx', font=f8, fill=COLORS['muted'])
              # Sidebar
              d.rectangle((31, 68, 58, 129), fill='#0a1220')
              for n, name in enumerate(['src', 'api', 'ui', 'infra', 'tests']):
                  y = 72 + n * 11
                  col = COLORS['cyan'] if n == 0 else COLORS['muted']
                  d.text((34, y), ('› ' + name), font=f8, fill=col)
              # Code lines animated
              lines = [
                  (COLORS['violet'], 68, 10), (COLORS['cyan'], 93, 0),
                  (COLORS['green'], 61, 4), (COLORS['text'], 103, 7),
                  (COLORS['cyan'], 84, 2), (COLORS['muted'], 75, 9)
              ]
              for idx, (col, basew, off) in enumerate(lines):
                  pulse = 0.82 + 0.18 * math.sin(t * math.tau + off)
                  width = int(basew * pulse)
                  y = 69 + idx * 10
                  d.rounded_rectangle((68, y, 68 + width, y + 3), radius=2, fill=col)
              # Typing cursor
              if i % 4 < 2:
                  d.rectangle((126, 119, 127, 126), fill=COLORS['text'])

              # Terminal monitor
              rr(d, (205, 45, 326, 137), 6, COLORS['panel'], COLORS['border'])
              d.line((205, 63, 326, 63), fill=COLORS['border'])
              d.text((213, 51), 'terminal — deploy', font=f8, fill=COLORS['muted'])
              commands = [
                  ('$ pnpm test', COLORS['cyan']),
                  ('✓ 128 tests passed', COLORS['green']),
                  ('$ docker build .', COLORS['violet']),
                  ('✓ image ready', COLORS['green']),
                  ('$ deploy production', COLORS['cyan'])
              ]
              stage = min(4, i // 2)
              for idx in range(stage + 1):
                  d.text((214, 71 + idx * 12), commands[idx][0], font=f8, fill=commands[idx][1])
              if i % 2 == 0:
                  cy = 71 + (stage + 1) * 12
                  if cy < 132:
                      d.rectangle((214, cy, 218, cy + 7), fill=COLORS['text'])

              # Delivery dashboard
              rr(d, (336, 45, 427, 137), 6, COLORS['panel2'], COLORS['border'])
              d.text((344, 51), 'DELIVERY', font=f12, fill=COLORS['text'])
              steps = [('CODE', COLORS['cyan']), ('TEST', COLORS['violet']), ('IMAGE', COLORS['amber']), ('DEPLOY', COLORS['cyan']), ('HEALTH', COLORS['green'])]
              active = i % len(steps)
              for idx, (name, col) in enumerate(steps):
                  y = 73 + idx * 12
                  dot = col if idx <= active else COLORS['dim']
                  d.ellipse((345, y, 350, y + 5), fill=dot)
                  d.text((356, y - 2), name, font=f8, fill=COLORS['text'] if idx == active else COLORS['muted'])
              # Health/progress bar
              d.rectangle((345, 128, 419, 131), fill='#1d2939')
              prog = int(74 * (i / (N - 1)))
              d.rectangle((345, 128, 345 + prog, 131), fill=COLORS['cyan'])

              # Desk
              d.rounded_rectangle((52, 151, 379, 160), radius=4, fill='#334155')
              d.rectangle((101, 137, 110, 151), fill='#26364a')
              d.rectangle((257, 137, 266, 151), fill='#26364a')
              # Keyboard + mug
              rr(d, (183, 143, 250, 153), 3, '#172235', COLORS['border'])
              for k in range(9):
                  x = 187 + k * 6
                  d.line((x, 146, x, 150), fill='#52647b')
              d.ellipse((294, 145, 309, 157), fill='#172235')
              d.arc((303, 147, 315, 156), 270, 90, fill='#52647b', width=2)
              # steam
              steam = int(2 * math.sin(t * math.tau))
              d.arc((298, 137 + steam, 303, 146 + steam), 190, 350, fill='#7dd3fc')

              # Developer / chair (pixel-art from behind)
              # head
              d.ellipse((137, 94, 161, 118), fill='#d8e0ea')
              d.pieslice((136, 91, 162, 114), 180, 360, fill='#1a2433')
              # headphones
              d.arc((134, 92, 164, 120), 185, 355, fill=COLORS['cyan'], width=2)
              # body / chair
              rr(d, (132, 111, 166, 169), 9, '#121c2d', COLORS['border'])
              d.polygon([(146, 119), (151, 130), (156, 119), (153, 119), (151, 126), (148, 119)], fill=COLORS['violet'])
              d.line((151, 124, 155, 117), fill=COLORS['cyan'], width=2)
              # arms / typing motion
              shift = 2 if i % 4 < 2 else -1
              d.line((137, 128, 118 + shift, 141), fill='#d8e0ea', width=4)
              d.line((161, 128, 184 - shift, 141), fill='#d8e0ea', width=4)
              # chair legs
              d.line((148, 169, 148, 184), fill='#405269', width=3)
              d.line((148, 183, 134, 191), fill='#405269', width=3)
              d.line((148, 183, 162, 191), fill='#405269', width=3)

              # Bottom system status rack
              rr(d, (23, 170, 427, 188), 5, '#091423', COLORS['border'])
              statuses = [('API', '42ms', COLORS['cyan']), ('TESTS', '128/128', COLORS['green']), ('IMAGE', 'ready', COLORS['cyan']), ('PROD', 'healthy', COLORS['green'])]
              xs = [31, 130, 229, 329]
              for idx, (label, value, col) in enumerate(statuses):
                  d.text((xs[idx], 175), label, font=f8, fill=COLORS['muted'])
                  d.text((xs[idx] + 30, 175), value, font=f8, fill=col)
              # moving signal dot
              signal_x = 34 + int(370 * (i / (N - 1)))
              d.ellipse((signal_x, 193, signal_x + 4, 197), fill=COLORS['cyan'])

              # upscale nearest for crisp pixel art
              im = im.resize((W * SCALE, H * SCALE), Image.Resampling.NEAREST)
              im = im.quantize(colors=64, method=Image.Quantize.MEDIANCUT, dither=Image.Dither.NONE)
              frames.append(im)
              durations.append(120)

          frames[0].save(OUT, save_all=True, append_images=frames[1:], duration=durations, loop=0, optimize=True, disposal=2)
          print(f'rendered {len(frames)} frames at {W*SCALE}x{H*SCALE}: {OUT.stat().st_size} bytes')
          PY

      - name: Remove one-shot workflow and commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refine-engineer-gif.yml
          git add assets/dev-coding.gif
          git commit -m 'fix(profile): crisp dark pixel engineer animation'
          git push origin master
